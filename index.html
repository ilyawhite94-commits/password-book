 if(P){nv=`<div class="nav"><div class="nl"><button onclick="setPage(enc(cur)-1)" aria-label="Назад">←</button><button class="fp" onclick="showPick=!showPick;render()">${showPick?"Скрыть поиск":"Найти страницу"}</button></div><div class="ni"><div class="big" style="margin:0">${ptag(cur)}</div><div class="mut">стр. ${(enc(cur)+1).toLocaleString("ru")} из ${TOT.toLocaleString("ru")}</div></div><div class="nr"><button onclick="setPage(enc(cur)+1)" aria-label="Вперёд">→</button></div></div>`;pg=`<div class="paper ${blur?"blur":""}">${P.map((x,l)=>`<div class="lr ${sel===l?"sel":""}"><input class="lb" type="text" maxlength="40" value="${esc(x.w)}" aria-label="Название строки ${l+1}" onchange="setLb(${l},this.value)"><div class="pw"><button class="ln ${x.c>=0?"m":""}" ${x.c>=0?`style="background:${C[x.c].c}"`:""} onclick="tap(${l})">${x.t}</button><button class="cp" onclick="copy(P[${l}].t)" aria-label="Копировать пароль строки ${l+1}">Копировать</button></div></div>`).join("")}</div>`;
  if(sel!==null&&!mode){const c=P[sel].c;cd=`<div class="card"><b>Строка ${sel+1}${c>=0?": "+C[c].n+" маркер":": без маркера"}</b><div class="mut" style="margin-top:6px">Маркер этой строки (выберите цвет или уберите)</div><div class="pick" style="grid-template-columns:repeat(7,1fr)">${C.map((x,j)=>`<button class="${c===j?"on":""}" title="${x.n}" aria-label="${x.n} маркер" onclick="setMk(${sel},${j})"><span class="sw" style="background:${x.c};border:1px solid var(--line);width:20px;height:20px;margin:0"></span></button>`).join("")}<button ${c<0?"disabled":""} onclick="setMk(${sel},-1)" aria-label="Убрать маркер">✕</button></div><div class="row" style="margin-top:8px"><button class="p" onclick="copy(P[sel].t)">Скопировать</button><select id="bs" class="g">${V.acc.map((x,i)=>`<option value="${i}">${esc(x.n)}</option>`).join("")}</select><button onclick="bindSel()">Привязать</button></div></div>`}else if(!mode)cd=`<div class="card ph"><b>Строка не выбрана</b><p class="mut">Нажмите на пароль, чтобы выбрать цвет маркера, скопировать пароль или привязать его к аккаунту.</p></div>`}
 else if(!showPick)pg=`<p class="mut">Нажмите «Найти страницу».</p>`;
 a.innerHTML=`<div class="bv${mode?" bind":""}"><div class="a-ban">${ban}</div><div class="a-name">${nm}</div><div class="a-nav">${nv}</div><div class="a-page">${pg}</div><div class="a-card">${cd}</div><div class="a-ctrl row">${ct}</div><div class="a-pick">${pk}</div></div>`}
applyTheme();render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
